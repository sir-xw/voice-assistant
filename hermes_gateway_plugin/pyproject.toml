[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-gateway-plugin"
version = "0.1.0"
description = "Hermes voice gateway 客户端（voice-platform 插件）：连接 Voice Service 的 WebSocket 接入点，接收语音识别结果进 gateway 会话，把 LLM 回复文本下发朗读。唯一依赖 hermes 的部分。"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "websockets>=12.0",
]

# 注：运行于 hermes gateway 进程（hermes venv）。
# - hermes_agent / gateway 等由 hermes 环境提供，不在此声明；
# - 协议契约依赖 voice_service 包（仅 import voice_service.protocol），
#   安装本插件时需在同一个 venv 先安装 ./voice_service
#   （pip install -e ./voice_service ./hermes_gateway_plugin）

[project.optional-dependencies]
protocol = []

[tool.setuptools.packages.find]
include = ["hermes_gateway_plugin*"]

# hermes 插件 entry point：pip 安装即注册 voice-platform 语音平台插件。
# 注意：旧的同名插件（voice_agent.gateway_plugin）已卸载退役；若在其它 venv 里同时
# 安装了旧包，会存在同名 entry point 冲突（见架构文档 M4）。
[project.entry-points."hermes_agent.plugins"]
voice-platform = "hermes_gateway_plugin"
