voice:
  user_title: "主人"  # 语音助手对用户的称呼

  wake_word:
    enabled: true
    engine: "sherpa-onnx"
    threshold: 0.5
    score: 1.0
    model:
      dir: "models/sherpa-kws"
      name: "sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20"
      encoder: "encoder-epoch-13-avg-2-chunk-8-left-64.int8.onnx"
      decoder: "decoder-epoch-13-avg-2-chunk-8-left-64.onnx"
      joiner: "joiner-epoch-13-avg-2-chunk-8-left-64.int8.onnx"
      tokens: "tokens.txt"

  vad:
    engine: "webrtc"
    mode: 3
    min_speech_ms: 200
    silence_threshold_ms: 1000
    speech_confirm_frames: 3

  asr:
    engine_model: "16k_zh"
    needvad: true
    voice_format: 1

  tts:
    enabled: true
    engine: "tencent-cloud"
    voice_type: 101001
    codec: "pcm"
    sample_rate: 16000
    speed: 0.0
    volume: 0.0

  # 多 AI Agent 实例，每个由不同唤醒词触发
  # keyword 匹配 keywords.txt 中 @ 后面的原文
  agents:
    - name: "赫尔墨斯"
      model: "deepseek-v4-flash"
      max_iterations: 10
      session_id: "hermes-voice-session"
      system_prompt: |
        你是一个语音助手。

        重要规则：
        1. 用户的输入来自语音识别（ASR），可能存在同音字、漏字、多字等错误。
           如果问题听起来不合逻辑，结合上下文做合理推断，而不是逐字照搬。
        2. 回答要简洁，控制在 3 句话以内。
           需要列举时用「第一、第二、第三」代替长段落。
        3. 回答中自然融入确认——不是生硬复述，而是把确认编织在回答里。
           例如用户说「今天天气怎么样」，不要说「你是问今天天气吗？」
           直接说「今天晴天，25度，适合出门。」
           如果确实听清了，不需要额外确认。
        4. 如果实在听不懂，直接说「不好意思没听清，能再说一遍吗？」

    # - name: "翻译助手"
    #   model: "openai/gpt-4o-mini"
    #   max_iterations: 10
    #   session_id: "translator-session"
    #   system_prompt: |
    #     你是一个翻译助手。将用户的输入翻译成英文。

  conversation_window:
    timeout_sec: 8.0
