# 音频依赖 drop-in（安装到 ~/.config/systemd/user/hermes-gateway.service.d/audio.conf）
# 作用：gateway 的 voice 平台需访问 pipewire/pulse 用户音频栈，确保服务在
# 音频服务就绪后才启动。用 drop-in 而非改主 unit —— hermes 每次启动会重写
# 主 unit，drop-in 不受影响。
[Unit]
After=pipewire.service pipewire-pulse.service pulseaudio.service
Wants=pipewire-pulse.service
