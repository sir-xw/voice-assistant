# voice-platform 插件元数据（目录部署时使用；entry-point 分发时从 dist 元数据读取）
name: voice-platform
label: 语音
kind: platform
version: 0.1.0
description: >
  Hermes Agent 语音平台：sherpa 唤醒词 + WebRTC VAD + 腾讯云 ASR/TTS。
  每个唤醒词对应一个独立 gateway 会话（chat_id=wake:<名>），回复经
  腾讯云 TTS 流式播报，工具轮文字回复由 post_api_request 钩子直接播报。
requires_env:
  - name: VOICE_SecretId
    description: "腾讯云 SecretId"
    prompt: "腾讯云 SecretId"
    password: false
  - name: VOICE_SecretKey
    description: "腾讯云 SecretKey"
    prompt: "腾讯云 SecretKey"
    password: true
  - name: VOICE_AppId
    description: "腾讯云 AppId"
    prompt: "腾讯云 AppId"
    password: false
