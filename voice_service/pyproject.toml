[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-service"
version = "0.1.0"
description = "Voice Service：独立语音服务（麦克风采集 / sherpa 唤醒词 / WebRTC VAD / 腾讯云 ASR / 腾讯云 TTS / 播放），对外提供 WebSocket 接入点。零 hermes 依赖。"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "sounddevice>=0.4.6",
    "webrtcvad>=2.0.10",
    "sherpa-onnx>=1.10",
    "pypinyin==0.55.0",
    "websocket-client>=1.8.0",
    "websockets>=17.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# 说话人识别（voiceprint）附带的额外依赖（CAM++ 特征提取走 sherpa-onnx，通常无需额外项；
# 若未来接入需 onnxruntime 等，在此补充）
voiceprint = []

[tool.setuptools.packages.find]
include = ["voice_service*"]

[tool.setuptools.package-data]
"voice_service" = ["assets/*.wav"]
